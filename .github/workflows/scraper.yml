name: "Sistema Maestro Scraper"

on:
  schedule:
    # Corre cada 30 minutos (UTC)
    - cron: '*/30 * * * *'
  # Permite ejecutar el workflow manualmente desde la interfaz de Github Actions
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    
    # Otorgar permisos al GITHUB_TOKEN para hacer commit de vuelta al repo
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Scraper
        env:
          # Estas variables vendrán de GitHub Settings > Secrets and variables > Actions
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit Action State (Excel and JSON)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Intentar agregar archivos si cambiaron o fueron creados
          git add vacantes_vistas.json nuevas_plazas.xlsx || true
          # Hacer commit solo si hay cambios. Si no, salir silenciosamente (exit 0)
          git commit -m "auto: actualizando historial de vacantes y excel" || exit 0
          git push
